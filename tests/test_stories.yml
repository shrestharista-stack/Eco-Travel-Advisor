version: "3.1"

stories:

- story: test city break happy path
  steps:
  - user: |
      hello there
    intent: greet
  - action: utter_greet
  - intent: city_break
  - action: utter_city_break_info
  - action: trip_planning_form
  - active_loop: trip_planning_form
  - active_loop: null
  - action: action_calculate_carbon
  - action: action_recommend_options
  - user: |
      thanks a lot
    intent: thank_you
  - action: utter_thank_you

- story: test carbon footprint query
  steps:
  - user: |
      hi
    intent: greet
  - action: utter_greet
  - user: |
      what is the carbon footprint
    intent: carbon_footprint
  - action: action_calculate_carbon
  - user: |
      bye
    intent: goodbye
  - action: utter_goodbye

- story: test human handover request
  steps:
  - user: |
      I want to plan a trip
    intent: plan_a_trip
  - action: utter_ask_trip_type
  - user: |
      can I talk to a real person
    intent: request_human_advisor
  - action: action_human_handover

- story: test out of scope then recover
  steps:
  - user: |
      tell me the weather
    intent: out_of_scope
  - action: utter_ask_rephrase
  - user: |
      I want to plan a trip
    intent: plan_a_trip
  - action: utter_ask_trip_type

- story: test fallback behaviour
  steps:
  - user: |
      asdfghjkl random text
    intent: nlu_fallback
  - action: action_default_fallback
